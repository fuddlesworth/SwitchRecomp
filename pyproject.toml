# Settings for ruff, which scripts/format.sh runs through uvx. scarletnx runs from the checkout
# (python3 -m scarletnx) and is never installed, so this file holds nothing else.
[tool.ruff]
line-length = 120
# The oldest Python the README asks for
target-version = "py312"

[tool.ruff.format]
quote-style = "single"
