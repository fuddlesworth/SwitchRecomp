name: Build

on:
  push:
    branches: [main]
    tags: ['v*'] # a version's release (publish.yml)
  pull_request:
  workflow_dispatch:

# Jobs only read the repository. A push to main that builds everywhere becomes a nightly, and a pull request's run a
# prerelease, in scarletnx/nightly: publish.yml does it once this workflow ends
permissions:
  contents: read

# Linux jobs run in Arch Linux, which has the same Clang 23 and clang-format 23 as development, and its LLVM 23 for the
# recompiler's code generator (required, cmake/llvm.cmake). Windows uses MSYS2 CLANG64 so Clang, the MinGW/UCRT runtime
# and LLVM's development libraries come from one compatible toolchain. FFmpeg, OpenSSL, Vulkan and SDL3 are built from
# the pinned CPM sources, with MSYS2 providing the shell, GNU make and NASM needed by FFmpeg and the Perl OpenSSL's
# Configure runs on. Downloads are cached in .cache/cpm, one cache per job since each job fetches a different set.
# Compiles go through ccache, whose .cache/ccache each compiling job restores from its newest run and saves trimmed to
# what the run used. The artifacts are what `cmake --install` puts in place: the binaries with the licenses that go
# with them.
jobs:
  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
            container: archlinux:latest
          # Arch's image is x86-64 only; pkgforge's (the AppImage's) is Arch Linux ARM on AArch64, with the same LLVM
          - arch: aarch64
            runner: ubuntu-24.04-arm
            container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      # Artifacts carry the commit they came from: the branch's head in a pull request, else the commit pushed
      - name: Name the commit
        id: commit
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      # llvm: llvm-config and LLVM-C for the recompiler (llvm-libs alone has no headers). libgccjit builds the
      # optional --backend=gcc too, so its tests (gccjit_differential, native_recompiler_gcc) run here. gdb: the
      # gdbserver gdbstub_native drives. Mirrors drop a connection now and then (pkgforge's for aarch64 most), so each
      # pacman install is tried 3 times, 5 s apart
      - name: Install tools
        run: |
          for try in 1 2 3; do
            pacman -Syu --noconfirm --needed cmake ninja make patch nasm perl python git clang llvm libgccjit pkgconf sdl3 libxtst libxrandr libxss vulkan-swrast ccache gdb && break
            [ "$try" = 3 ] && exit 1
            sleep 5
          done
      # two commits: a pull request's merge commit and the base it is diffed against below
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-${{ github.job }}-${{ matrix.arch }}-${{ hashFiles('cmake/dependencies.cmake') }}
      # ccache under every compile, FFmpeg's and OpenSSL's too, from the newest cache of this job on this branch, else
      # on main. Each cmake gets it as its launcher: from the environment CMake would run its configure checks through
      # it, and they only miss
      - uses: actions/cache/restore@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ github.job }}-${{ matrix.arch }}-
      # FFmpeg's and OpenSSL's builds (cmake/deps_cache.cmake), from the newest cache of this job on this branch, else
      # on main. The key named here is never saved: a run saves its own below, named after the builds it used
      - uses: actions/cache/restore@v5
        id: deps
        with:
          path: .cache/deps
          key: deps-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: deps-${{ github.job }}-${{ matrix.arch }}-
      - name: Set up the caches
        shell: bash
        run: |
          ws=${GITHUB_WORKSPACE//\\//}
          {
            echo "CCACHE_DIR=$ws/.cache/ccache"
            # paths in the keys relative to the checkout, and no build folder in them: build trees share entries
            echo "CCACHE_BASEDIR=$ws"
            echo "CCACHE_NOHASHDIR=true"
            echo "SNX_DEPS_CACHE=$ws/.cache/deps"
            echo "SNX_CCACHE_START=$(date +%s)"
          } >> "$GITHUB_ENV"
      - name: Build the runtime
        run: |
          cmake --preset default -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset default --parallel "$(getconf _NPROCESSORS_ONLN)"
          cmake --install build/default --prefix stage
      # The fallback is CMake's (cmake/dependencies.cmake pins SDL3) and the Windows job builds the same SDL3 from
      # source: a pull request that changes no CMake file and not this workflow skips it, a push always builds it
      - name: Look for CMake changes
        id: cmake-changed
        if: github.event_name == 'pull_request'
        run: |
          # safe.directory for this command only: the container's git refuses the checkout, and the build
          # (cmake/commit.cmake) and build_info_commit after it must see it the same way
          changed=$(git -c safe.directory="$GITHUB_WORKSPACE" diff --name-only HEAD^1 HEAD)
          printf '%s\n' "$changed"
          if grep -qE '(^|/)CMakeLists\.txt$|\.cmake$|^CMakePresets\.json$|^\.github/workflows/build\.yml$' <<<"$changed"; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the SDL3 fallback without a system package
        if: github.event_name != 'pull_request' || steps.cmake-changed.outputs.yes == 'true'
        run: |
          cmake --preset default -B build/sdl-fallback -DCMAKE_DISABLE_FIND_PACKAGE_SDL3=ON \
            -DSNX_DEPLOY=OFF -DBUILD_TESTING=OFF -DSDL_WAYLAND=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/sdl-fallback --target scarletnx --parallel "$(getconf _NPROCESSORS_ONLN)"
      - name: Build SDL3 with headless Vulkan tests
        run: |
          cmake --preset default -B build/headless -DSNX_BUILD_GUI=OFF -DSNX_DEPLOY=OFF -DSNX_TEST_VULKAN=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/headless --parallel "$(getconf _NPROCESSORS_ONLN)"
      # Only what this run used is kept, so the cache saved is one build's worth
      - name: Trim the compiler cache
        run: |
          ccache --show-stats --verbose
          ccache --evict-older-than "$(( $(date +%s) - SNX_CCACHE_START ))s"
          ccache --zero-stats
          du -sh "$CCACHE_DIR"
      - uses: actions/cache/save@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Only the dependency builds this run's trees used stay, under a key named after them: saved when they changed
      - name: Name the dependency builds
        id: deps-used
        run: |
          used=$(find build -path '*/snx-deps/*.dir' -exec cat {} + | sort -u)
          for d in .cache/deps/*; do grep -qxF "${d##*/}" <<<"$used" || rm -rf "$d"; done
          echo "key=deps-${{ github.job }}-${{ matrix.arch }}-$(sha256sum <<<"$used" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: steps.deps-used.outputs.key != steps.deps.outputs.cache-matched-key
        uses: actions/cache/save@v5
        with:
          path: .cache/deps
          key: ${{ steps.deps-used.outputs.key }}
      - name: Test headless Vulkan and NX runtime
        run: ctest --test-dir build/headless -R '^(vulkan_headless|nx_runtime_homebrew)$' --output-on-failure
      # The game modules compile src/common/cpu/aarch64/cpu_helpers.c, which no CMake target does
      - name: Check the ABI helpers compile
        run: clang -fsyntax-only -Wall -fno-strict-aliasing -fwrapv -I src src/common/cpu/aarch64/cpu_helpers.c
      - name: Test native tooling and indexed filesystems
        run: ctest --test-dir build/default --output-on-failure --parallel 4
      - name: Check optional Python diagnostics
        run: |
          python -m compileall -q tools
          python tools/run_game.py --help > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: ScarletNX-linux-${{ matrix.arch }}-${{ steps.commit.outputs.short }}-install
          path: stage

  appimage:
    name: Linux AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    # pkgforge's Arch image and tools (https://github.com/pkgforge-dev/Anylinux-AppImages), see scripts/make-appimage.sh
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      # Artifacts carry the commit they came from: the branch's head in a pull request, else the commit pushed
      - name: Name the commit
        id: commit
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      # Before the checkout: without git, actions/checkout downloads the files without the history, and the AppImage's
      # version (git describe) is unknown. Each pacman install is tried 3 times, as in the linux job
      - name: Install git
        run: |
          for try in 1 2 3; do
            pacman -Syu --noconfirm --needed git && break
            [ "$try" = 3 ] && exit 1
            sleep 5
          done
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-${{ github.job }}-${{ matrix.arch }}-${{ hashFiles('cmake/dependencies.cmake') }}
      # ccache, set up as in the linux job
      - uses: actions/cache/restore@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ github.job }}-${{ matrix.arch }}-
      # the dependency builds, as in the linux job
      - uses: actions/cache/restore@v5
        id: deps
        with:
          path: .cache/deps
          key: deps-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: deps-${{ github.job }}-${{ matrix.arch }}-
      - name: Set up the caches
        shell: bash
        run: |
          ws=${GITHUB_WORKSPACE//\\//}
          {
            echo "CCACHE_DIR=$ws/.cache/ccache"
            echo "CCACHE_BASEDIR=$ws"
            echo "CCACHE_NOHASHDIR=true"
            echo "SNX_DEPS_CACHE=$ws/.cache/deps"
            echo "SNX_CCACHE_START=$(date +%s)"
          } >> "$GITHUB_ENV"
      # The action pins its own setup script only: the tools that script downloads are pinned here to a commit of
      # Anylinux-AppImages, and checked against their SHA-256 below
      - name: Install the packaging tools
        uses: pkgforge-dev/anylinux-setup-action@b2d1ce4216f71162e00ae58fa11ee9aeb723d0d5 # v5
        env:
          QUICK_SHARUN: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/d4262a9978e7b5d88e3799b389b138eb244e3936/useful-tools/quick-sharun.sh
          DEBLOATED_PACKAGES: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/d4262a9978e7b5d88e3799b389b138eb244e3936/useful-tools/get-debloated-pkgs.sh
          MAKE_AUR_PACKAGE: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/d4262a9978e7b5d88e3799b389b138eb244e3936/useful-tools/make-aur-package.sh
      - name: Check the packaging tools
        run: |
          sha256sum -c <<'EOF'
          b38ac233f0b56a03bb10565f6b074a43ce016939faee44ae8bb23d6e66c2d553  /usr/local/bin/quick-sharun
          217ff68aafe085d2d4ab34a50e267805af43736ad8ef880c01ef88e52db8589f  /usr/local/bin/get-debloated-pkgs
          86afbf5045b78020c93fcd35bf0f642765a8dc339bb2dce534a0461ce3d3508d  /usr/local/bin/make-aur-package
          EOF
      # llvm for the recompiler, libgccjit for its --backend=gcc; quick-sharun bundles the libLLVM and libgccjit the
      # runtime links, with their own dependencies. GNU as and ld, which --backend=gcc runs, stay the system's
      - name: Install the build tools and the debloated Mesa
        run: |
          for try in 1 2 3; do
            pacman -Syu --noconfirm --needed cmake ninja make patch nasm perl clang llvm libgccjit sdl3 libx11 mesa vulkan-icd-loader ccache && break
            [ "$try" = 3 ] && exit 1
            sleep 5
          done
          get-debloated-pkgs --add-common --prefer-nano
      - name: Build and install into /usr
        run: |
          git config --global --add safe.directory '*'
          cmake --preset default -DSNX_DEPLOY=OFF -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset default --parallel "$(getconf _NPROCESSORS_ONLN)"
          cmake --install build/default
      - name: Trim the compiler cache
        run: |
          ccache --show-stats --verbose
          ccache --evict-older-than "$(( $(date +%s) - SNX_CCACHE_START ))s"
          ccache --zero-stats
          du -sh "$CCACHE_DIR"
      - uses: actions/cache/save@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Name the dependency builds
        id: deps-used
        run: |
          used=$(find build -path '*/snx-deps/*.dir' -exec cat {} + | sort -u)
          for d in .cache/deps/*; do grep -qxF "${d##*/}" <<<"$used" || rm -rf "$d"; done
          echo "key=deps-${{ github.job }}-${{ matrix.arch }}-$(sha256sum <<<"$used" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: steps.deps-used.outputs.key != steps.deps.outputs.cache-matched-key
        uses: actions/cache/save@v5
        with:
          path: .cache/deps
          key: ${{ steps.deps-used.outputs.key }}
      # The script names the AppImage after `git describe`
      - name: Make the AppImage
        run: scripts/make-appimage.sh
      # Only what the script made: dist/ also holds the tracked desktop entry and icon
      - uses: actions/upload-artifact@v7
        with:
          name: ScarletNX-linux-${{ matrix.arch }}-${{ steps.commit.outputs.short }}.AppImage
          path: |
            dist/*.AppImage*
            dist/appinfo

  windows:
    name: Windows (Clang + LLVM)
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Artifacts carry the commit they came from: the branch's head in a pull request, else the commit pushed
      - name: Name the commit
        id: commit
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-${{ github.job }}-${{ hashFiles('cmake/dependencies.cmake') }}
      # ccache, set up as in the linux job
      - uses: actions/cache/restore@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ github.job }}-
      # the dependency builds, as in the linux job
      - uses: actions/cache/restore@v5
        id: deps
        with:
          path: .cache/deps
          key: deps-${{ github.job }}-${{ github.run_id }}
          restore-keys: deps-${{ github.job }}-
      - name: Set up the caches
        shell: bash
        run: |
          ws=${GITHUB_WORKSPACE//\\//}
          {
            echo "CCACHE_DIR=$ws/.cache/ccache"
            echo "CCACHE_BASEDIR=$ws"
            echo "CCACHE_NOHASHDIR=true"
            echo "SNX_DEPS_CACHE=$ws/.cache/deps"
            echo "SNX_CCACHE_START=$(date +%s)"
          } >> "$GITHUB_ENV"
      # llvm-mingw alone has no LLVM development libraries. Do not mix its C++ runtime with another LLVM build.
      - name: Install Clang, LLVM development files and FFmpeg build tools
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: CLANG64
          update: true
          path-type: strict
          install: >-
            git
            make
            patch
            perl
            patchutils
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-nasm
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-ccache
            mingw-w64-ucrt-x86_64-libgccjit
            mingw-w64-ucrt-x86_64-binutils
      - name: Check required dependencies
        run: |
          set -euo pipefail
          # libgccjit and the binutils it runs come from UCRT64 (CLANG64 has no libgccjit), after CLANG64's on PATH
          echo 'PATH="$PATH:/ucrt64/bin"' > /etc/profile.d/zz-ucrt64.sh
          test -f /ucrt64/include/libgccjit.h
          test -f /ucrt64/lib/libgccjit.dll.a
          clang --version
          llvm-config --version
          test -f "$(llvm-config --includedir)/llvm-c/Core.h"
          test -d "$(llvm-config --libdir)"
          llvm-config --libs core native passes target analysis
          make --version
          perl --version
          nasm --version
          spirv-val --version
          spirv-dis --version
      - name: Build the runtime and pinned dependencies
        run: |
          set -euo pipefail
          # libgccjit.h alone: UCRT64's include folder is another C runtime's headers too
          mkdir -p build/gccjit-include
          cp /ucrt64/include/libgccjit.h build/gccjit-include/
          cmake --preset default \
            -DSNX_LLVM_CONFIG="$(cygpath -m "$(command -v llvm-config)")" \
            -DSNX_FFMPEG_SH="$(cygpath -m /usr/bin/sh.exe)" \
            -DSNX_FFMPEG_MAKE="$(cygpath -m /usr/bin/make.exe)" \
            -DPERL_EXECUTABLE="$(cygpath -m /usr/bin/perl.exe)" \
            -DSNX_OPENSSL_MAKE="$(cygpath -m /usr/bin/make.exe)" \
            -DCMAKE_DISABLE_FIND_PACKAGE_SDL3=ON -DSNX_DEPLOY=OFF \
            -DSNX_GCCJIT_INCLUDE_DIR="$(cygpath -m "$PWD/build/gccjit-include")" \
            -DSNX_GCCJIT_LIBRARY="$(cygpath -m /ucrt64/lib/libgccjit.dll.a)" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset default --parallel "$(getconf _NPROCESSORS_ONLN)"
          cmake --install build/default --prefix stage
      - name: Trim the compiler cache
        run: |
          ccache --show-stats --verbose
          ccache --evict-older-than "$(( $(date +%s) - SNX_CCACHE_START ))s"
          ccache --zero-stats
          du -sh "$CCACHE_DIR"
      - uses: actions/cache/save@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Name the dependency builds
        id: deps-used
        run: |
          used=$(find build -path '*/snx-deps/*.dir' -exec cat {} + | sort -u)
          for d in .cache/deps/*; do grep -qxF "${d##*/}" <<<"$used" || rm -rf "$d"; done
          echo "key=deps-${{ github.job }}-$(sha256sum <<<"$used" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: steps.deps-used.outputs.key != steps.deps.outputs.cache-matched-key
        uses: actions/cache/save@v5
        with:
          path: .cache/deps
          key: ${{ steps.deps-used.outputs.key }}
      # Explorer and the taskbar show the first icon of an executable's resources (runtime.rc)
      - name: Check the executables' icon
        run: |
          set -euo pipefail
          for exe in stage/bin/scarletnx.exe; do
            # the whole listing first: grep -q stopping early would fail the pipe under pipefail
            resources=$(llvm-readobj --coff-resources "$exe")
            if ! grep -q 'Type: GROUP_ICON' <<<"$resources"; then
              echo "$exe has no icon" >&2
              exit 1
            fi
          done
      - name: Check the native driver
        run: |
          set -euo pipefail
          build/default/scarletnx.exe --help > /dev/null
          build/default/scarletnx.exe --extract --help > /dev/null
          build/default/scarletnx.exe --recomp --help > /dev/null
      - name: Test native tooling and indexed filesystems
        run: |
          set -euo pipefail
          ctest --test-dir build/default --output-on-failure --parallel 4
      - name: Bundle runtime DLLs and licenses
        run: |
          set -euo pipefail
          shopt -s nullglob
          # --backend=gcc assembles and links with these, beside the runtime (gccjit/jit_units.c)
          cp /ucrt64/bin/as.exe /ucrt64/bin/ld.exe stage/bin/
          # Follow imports recursively so the artifact works without MSYS2 on PATH.
          # Windows system DLLs are supplied by Windows, never copied from the runner.
          binaries=(stage/bin/*.exe stage/bin/*.dll)
          for ((i = 0; i < ${#binaries[@]}; ++i)); do
            imports=$(llvm-objdump -p "${binaries[i]}")
            while IFS= read -r dll; do
              source="$MINGW_PREFIX/bin/$dll"
              [[ -f "$source" ]] || source="/ucrt64/bin/$dll" # libgccjit's and binutils'
              destination="stage/bin/$dll"
              if [[ -f "$source" && ! -f "$destination" ]]; then
                cp "$source" "$destination"
                binaries+=("$destination")
              fi
            done < <(printf '%s\n' "$imports" | awk '/DLL Name:/ { sub(/\r$/, "", $3); print $3 }')
          done
          mkdir -p stage/share/licenses/msys2
          cp -R "$MINGW_PREFIX/share/licenses/." stage/share/licenses/msys2/
          cp -R /ucrt64/share/licenses/. stage/share/licenses/msys2/
          pacman -Q > stage/share/licenses/msys2/build-packages.txt
      - name: Check the artifact without the toolchain on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$(Resolve-Path stage/bin);$env:SystemRoot\System32;$env:SystemRoot"
          & .\stage\bin\scarletnx.exe --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: ScarletNX-windows-x86_64-${{ steps.commit.outputs.short }}
          path: stage
          if-no-files-found: error

  # The Android app (docs/ANDROID.md): each ABI on a runner of its own, with the runner's Gradle and JDK. LLVM's
  # libraries for the ABI take most of an hour, so they are kept until the script that builds them changes. Each job
  # packs an APK of its ABI; android-apk packs one holding both
  android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        abi: [x86_64, arm64-v8a]
    env:
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358
    steps:
      # Artifacts carry the commit they came from: the branch's head in a pull request, else the commit pushed
      - name: Name the commit
        id: commit
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-${{ github.job }}-${{ matrix.abi }}-${{ hashFiles('cmake/dependencies.cmake') }}
      - uses: actions/cache@v5
        id: llvm
        with:
          path: android-llvm/${{ matrix.abi }}
          key: android-llvm-${{ matrix.abi }}-${{ hashFiles('scripts/android-llvm.sh') }}-${{ env.ANDROID_NDK_ROOT }}
      # The NDK named above, which the runner's image may no longer carry, and NASM for FFmpeg's x86-64 assembly.
      # sdkmanager's download sometimes ends early ("Premature EOF"): tried 3 times, 5 s apart
      - name: Install the NDK and NASM
        run: |
          for try in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${ANDROID_NDK_ROOT##*/}" > /dev/null && break
            [ "$try" = 3 ] && exit 1
            sleep 5
          done
          sudo apt-get update && sudo apt-get install -y nasm ccache
      - name: Build LLVM's libraries
        if: steps.llvm.outputs.cache-hit != 'true'
        run: scripts/android-llvm.sh ${{ matrix.abi }} "$PWD/android-llvm/${{ matrix.abi }}"
      # ccache, set up as in the linux job
      - uses: actions/cache/restore@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ matrix.abi }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ github.job }}-${{ matrix.abi }}-
      # the dependency builds, as in the linux job
      - uses: actions/cache/restore@v5
        id: deps
        with:
          path: .cache/deps
          key: deps-${{ github.job }}-${{ matrix.abi }}-${{ github.run_id }}
          restore-keys: deps-${{ github.job }}-${{ matrix.abi }}-
      - name: Set up the caches
        shell: bash
        run: |
          ws=${GITHUB_WORKSPACE//\\//}
          {
            echo "CCACHE_DIR=$ws/.cache/ccache"
            echo "CCACHE_BASEDIR=$ws"
            echo "CCACHE_NOHASHDIR=true"
            # the NDK is installed afresh on each run: its version, not its files' dates, says which compiler it is
            echo "CCACHE_COMPILERCHECK=string:$ANDROID_NDK_ROOT"
            echo "SNX_DEPS_CACHE=$ws/.cache/deps"
            echo "SNX_CCACHE_START=$(date +%s)"
          } >> "$GITHUB_ENV"
      - name: Build the native libraries and the APK
        run: |
          JAVA_HOME=$JAVA_HOME_21_X64 scripts/android-apk.sh "$PWD/build/android" "$PWD/android-llvm" \
            ${{ matrix.abi }} -- \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cp build/android/stage/gradle/outputs/apk/debug/ScarletNX-debug.apk ScarletNX-android-${{ matrix.abi }}-${{ steps.commit.outputs.short }}.apk
      - name: Trim the compiler cache
        run: |
          ccache --show-stats --verbose
          ccache --evict-older-than "$(( $(date +%s) - SNX_CCACHE_START ))s"
          ccache --zero-stats
          du -sh "$CCACHE_DIR"
      - uses: actions/cache/save@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ matrix.abi }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Name the dependency builds
        id: deps-used
        run: |
          used=$(find build -path '*/snx-deps/*.dir' -exec cat {} + | sort -u)
          for d in .cache/deps/*; do grep -qxF "${d##*/}" <<<"$used" || rm -rf "$d"; done
          echo "key=deps-${{ github.job }}-${{ matrix.abi }}-$(sha256sum <<<"$used" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: steps.deps-used.outputs.key != steps.deps.outputs.cache-matched-key
        uses: actions/cache/save@v5
        with:
          path: .cache/deps
          key: ${{ steps.deps-used.outputs.key }}
      # Not zipped: the artifact is the APK itself, named after it
      - uses: actions/upload-artifact@v7
        with:
          path: ScarletNX-android-${{ matrix.abi }}-${{ steps.commit.outputs.short }}.apk
          archive: false
          if-no-files-found: error
      # What android-apk packs: the libraries, SDL's Java and the icon, without this APK's Gradle output
      - uses: actions/upload-artifact@v7
        with:
          name: ScarletNX-android-${{ matrix.abi }}-${{ steps.commit.outputs.short }}-stage
          path: |
            build/android/stage
            !build/android/stage/gradle
          if-no-files-found: error

  android-apk:
    name: Android APK
    needs: android
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      # Artifacts carry the commit they came from: the branch's head in a pull request, else the commit pushed
      - name: Name the commit
        id: commit
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: ScarletNX-android-*-${{ steps.commit.outputs.short }}-stage
          merge-multiple: true
          path: stage
      - name: Pack the APK of both ABIs
        run: |
          JAVA_HOME=$JAVA_HOME_21_X64 gradle -p dist/android assembleDebug -Pscarletnx.stage="$PWD/stage"
          cp stage/gradle/outputs/apk/debug/ScarletNX-debug.apk ScarletNX-android-universal-${{ steps.commit.outputs.short }}.apk
      # A library that needs one Android 5.0 lacks fails to load there, and the app with it
      - name: Check the APK's libraries
        run: |
          set -euo pipefail
          apk=ScarletNX-android-universal-${{ steps.commit.outputs.short }}.apk
          readelf=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          mkdir apk && unzip -q "$apk" 'lib/*' -d apk
          system=" libc.so libm.so libdl.so liblog.so libandroid.so libz.so libEGL.so libGLESv1_CM.so libGLESv2.so libOpenSLES.so "
          for abi in x86_64 arm64-v8a; do
            for lib in libmain.so libscarletnx.so libscarletnx-run.so libhactool.so; do
              test -f "apk/lib/$abi/$lib" || { echo "$abi has no $lib" >&2; exit 1; }
              for needed in $("$readelf" -d "apk/lib/$abi/$lib" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p'); do
                [[ "$system" == *" $needed "* || -f "apk/lib/$abi/$needed" ]] ||
                  { echo "$abi/$lib needs $needed, which Android 5.0 does not have" >&2; exit 1; }
              done
            done
          done
      - uses: actions/upload-artifact@v7
        with:
          path: ScarletNX-android-universal-${{ steps.commit.outputs.short }}.apk
          archive: false
          if-no-files-found: error

  # macOS and iOS (docs/APPLE.md), on Apple silicon with Xcode's Clang and SDKs; FFmpeg, OpenSSL and SDL3 are built from
  # the pinned sources as everywhere. Until both have built green once, a failure here does not fail the run
  # (continue-on-error), which would hold back the nightly: they are new, and no Mac checked them before CI. Each app
  # carries Ryujinx's MoltenVK (V380-Ori/Ryujinx.MoltenVK): mainline's lacks patches emulators' pipelines need. The
  # release's tar, its SHA-256 the one GitHub lists for it
  macos:
    name: macOS (arm64)
    runs-on: macos-26
    timeout-minutes: 150
    continue-on-error: true
    env:
      MOLTENVK_RELEASE: v1.4.1-ryujinx
      MOLTENVK_SHA256: ea1c633808d0a61e86ee35af4bdc280f5f07f95633b95935f3e695dc5226e640
    steps:
      # Artifacts carry the commit they came from: the branch's head in a pull request, else the commit pushed
      - name: Name the commit
        id: commit
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-${{ github.job }}-${{ hashFiles('cmake/dependencies.cmake') }}
      # LLVM's libraries for the Mac (scripts/apple-llvm.sh) with AArch64's code generator alone, the one the recompiler
      # uses, built once per script and Xcode as the iOS job's. Saved as soon as they are built: actions/cache saves
      # only a job that succeeds, and a later step's failure would build them again next run. Xcode's Clang builds
      # everything, as a user's Mac does
      - name: Name the Xcode
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -s ' ' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        id: llvm
        with:
          path: apple-llvm
          key: macos-llvm-${{ hashFiles('scripts/apple-llvm.sh') }}-${{ steps.xcode.outputs.version }}
      - name: Install tools
        run: brew install ninja ccache
      - name: Build LLVM's libraries
        if: steps.llvm.outputs.cache-hit != 'true'
        run: scripts/apple-llvm.sh macos "$PWD/apple-llvm"
      - if: steps.llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: apple-llvm
          key: ${{ steps.llvm.outputs.cache-primary-key }}
      # ccache and the dependency builds, set up as in the linux job
      - uses: actions/cache/restore@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ github.job }}-
      - uses: actions/cache/restore@v5
        id: deps
        with:
          path: .cache/deps
          key: deps-${{ github.job }}-${{ github.run_id }}
          restore-keys: deps-${{ github.job }}-
      - name: Set up the caches
        run: |
          {
            echo "CCACHE_DIR=$GITHUB_WORKSPACE/.cache/ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_NOHASHDIR=true"
            echo "SNX_DEPS_CACHE=$GITHUB_WORKSPACE/.cache/deps"
            echo "SNX_CCACHE_START=$(date +%s)"
          } >> "$GITHUB_ENV"
      - name: Build the runtime
        run: |
          cmake --preset macos -DLLVM_DIR="$PWD/apple-llvm/lib/cmake/llvm" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset macos --parallel "$(getconf _NPROCESSORS_ONLN)"
          cmake --install build/macos --prefix stage
      - name: Trim the compiler cache
        run: |
          ccache --show-stats --verbose
          ccache --evict-older-than "$(( $(date +%s) - SNX_CCACHE_START ))s"
          ccache --zero-stats
          du -sh "$CCACHE_DIR"
      - uses: actions/cache/save@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Name the dependency builds
        id: deps-used
        run: |
          used=$(find build -path '*/snx-deps/*.dir' -exec cat {} + | sort -u)
          for d in .cache/deps/*; do grep -qxF "${d##*/}" <<<"$used" || rm -rf "$d"; done
          echo "key=deps-${{ github.job }}-$(shasum -a 256 <<<"$used" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: steps.deps-used.outputs.key != steps.deps.outputs.cache-matched-key
        uses: actions/cache/save@v5
        with:
          path: .cache/deps
          key: ${{ steps.deps-used.outputs.key }}
      - name: Check the ABI helpers compile
        run: clang -fsyntax-only -Wall -fno-strict-aliasing -fwrapv -I src src/common/cpu/aarch64/cpu_helpers.c
      - name: Test native tooling and indexed filesystems
        run: ctest --test-dir build/macos --output-on-failure --parallel 4
      - name: Fetch MoltenVK
        run: |
          curl -fL -o moltenvk.tar \
            "https://github.com/V380-Ori/Ryujinx.MoltenVK/releases/download/$MOLTENVK_RELEASE/MoltenVK-macos.tar"
          echo "$MOLTENVK_SHA256  moltenvk.tar" | shasum -a 256 -c
          mkdir moltenvk && tar -xf moltenvk.tar -C moltenvk
      # ditto keeps the app's links and its signature, which zip would not
      - name: Make the app
        run: |
          scripts/apple-app.sh macos stage app moltenvk
          ditto -c -k --keepParent app/ScarletNX.app ScarletNX-macos-arm64-${{ steps.commit.outputs.short }}.zip
      - uses: actions/upload-artifact@v7
        with:
          path: ScarletNX-macos-arm64-${{ steps.commit.outputs.short }}.zip
          archive: false
          if-no-files-found: error

  ios:
    name: iOS (arm64)
    runs-on: macos-26
    timeout-minutes: 150
    continue-on-error: true
    env:
      MOLTENVK_RELEASE: v1.4.1-ryujinx
      MOLTENVK_SHA256: 7cec48d4e73cf9eb89b60e8596758900caaf8398c49ae8abe4544295fb7e0c84
    steps:
      # Artifacts carry the commit they came from: the branch's head in a pull request, else the commit pushed
      - name: Name the commit
        id: commit
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-${{ github.job }}-${{ hashFiles('cmake/dependencies.cmake') }}
      # LLVM's libraries for iOS (scripts/apple-llvm.sh) with AArch64's code generator alone, built once per script and
      # Xcode as Android's per NDK, and saved as soon as they are built (see the macos job)
      - name: Name the Xcode
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -s ' ' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        id: llvm
        with:
          path: ios-llvm
          key: ios-llvm-${{ hashFiles('scripts/apple-llvm.sh') }}-${{ steps.xcode.outputs.version }}
      - name: Install tools
        run: brew install ninja ccache
      - name: Build LLVM's libraries
        if: steps.llvm.outputs.cache-hit != 'true'
        run: scripts/apple-llvm.sh ios "$PWD/ios-llvm"
      - if: steps.llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ios-llvm
          key: ${{ steps.llvm.outputs.cache-primary-key }}
      # ccache and the dependency builds, set up as in the linux job
      - uses: actions/cache/restore@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ github.job }}-
      - uses: actions/cache/restore@v5
        id: deps
        with:
          path: .cache/deps
          key: deps-${{ github.job }}-${{ github.run_id }}
          restore-keys: deps-${{ github.job }}-
      - name: Set up the caches
        run: |
          {
            echo "CCACHE_DIR=$GITHUB_WORKSPACE/.cache/ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_NOHASHDIR=true"
            echo "SNX_DEPS_CACHE=$GITHUB_WORKSPACE/.cache/deps"
            echo "SNX_CCACHE_START=$(date +%s)"
          } >> "$GITHUB_ENV"
      - name: Build the app
        run: |
          cmake --preset ios -DLLVM_DIR="$PWD/ios-llvm/lib/cmake/llvm" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset ios --parallel "$(getconf _NPROCESSORS_ONLN)"
          cmake --install build/ios --prefix stage
      - name: Trim the compiler cache
        run: |
          ccache --show-stats --verbose
          ccache --evict-older-than "$(( $(date +%s) - SNX_CCACHE_START ))s"
          ccache --zero-stats
          du -sh "$CCACHE_DIR"
      - uses: actions/cache/save@v5
        with:
          path: .cache/ccache
          key: ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Name the dependency builds
        id: deps-used
        run: |
          used=$(find build -path '*/snx-deps/*.dir' -exec cat {} + | sort -u)
          for d in .cache/deps/*; do grep -qxF "${d##*/}" <<<"$used" || rm -rf "$d"; done
          echo "key=deps-${{ github.job }}-$(shasum -a 256 <<<"$used" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: steps.deps-used.outputs.key != steps.deps.outputs.cache-matched-key
        uses: actions/cache/save@v5
        with:
          path: .cache/deps
          key: ${{ steps.deps-used.outputs.key }}
      - name: Fetch MoltenVK
        run: |
          curl -fL -o moltenvk.tar \
            "https://github.com/V380-Ori/Ryujinx.MoltenVK/releases/download/$MOLTENVK_RELEASE/MoltenVK-ios.tar"
          echo "$MOLTENVK_SHA256  moltenvk.tar" | shasum -a 256 -c
          mkdir moltenvk && tar -xf moltenvk.tar -C moltenvk
      # Unsigned: AltStore, SideStore or a developer account sign it for the device it goes on, with
      # dist/apple/ScarletNX.entitlements
      - name: Make the IPA
        run: |
          scripts/apple-app.sh ios stage app moltenvk
          mv app/ScarletNX.ipa ScarletNX-ios-arm64-${{ steps.commit.outputs.short }}.ipa
      - uses: actions/upload-artifact@v7
        with:
          path: ScarletNX-ios-arm64-${{ steps.commit.outputs.short }}.ipa
          archive: false
          if-no-files-found: error

  # The packages as a user gets them, each on a runner of its own (scripts/check-package.sh): in the build jobs the
  # checkout sits where the package looks for one, and stands in for what an installed copy lacks
  appimage-check:
    name: Linux AppImage (${{ matrix.arch }}), as installed
    needs: appimage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      # Artifacts carry the commit they came from: the branch's head in a pull request, else the commit pushed
      - name: Name the commit
        id: commit
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ScarletNX-linux-${{ matrix.arch }}-${{ steps.commit.outputs.short }}.AppImage
          path: dist
      # Artifacts drop the executable bit
      # --backend=gcc runs the AppImage's own as and ld: check-package.sh leaves the runner's binutils off PATH
      - name: Run the AppImage as a user would
        run: |
          chmod +x dist/*.AppImage
          scripts/check-package.sh dist/*.AppImage

  windows-check:
    name: Windows zip, as installed
    needs: windows
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # Artifacts carry the commit they came from: the branch's head in a pull request, else the commit pushed
      - name: Name the commit
        id: commit
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      # Not in the workspace root: the build's checkout was there, and the package would take this one for it
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/download-artifact@v8
        with:
          name: ScarletNX-windows-x86_64-${{ steps.commit.outputs.short }}
          path: package
      # --backend=gcc with the zip's libgccjit, as and ld: check-package.sh leaves any binutils of the runner off PATH
      - name: Run the zip's scarletnx.exe as a user would
        run: bash source/scripts/check-package.sh package/bin/scarletnx.exe

  # A pull request's builds, linked from a comment on it that each run rewrites, as soon as they are built
  # (scripts/pr-builds.sh). A pull request from a fork gets a token that may not write, so it gets none
  links:
    name: Links to the builds
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [linux, appimage, windows, android-apk, macos, ios]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/pr-builds.sh
          sparse-checkout-cone-mode: false
      - name: Link the builds from the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS: ${{ toJSON(needs) }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/pr-builds.sh "$GITHUB_REPOSITORY" "$PR" "$GITHUB_RUN_ID" "$SHA"
