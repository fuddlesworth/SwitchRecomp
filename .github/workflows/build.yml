name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Jobs only read the repository; the release job asks for more on its own
permissions:
  contents: read

# Linux jobs run in Arch Linux, which has the same Clang 23 and clang-format 23 as development. The Windows job starts
# from a bare runner and gets every tool from scripts/bootstrap.ps1, the way a Windows user does. The third-party
# libraries come from CPM.cmake at configure time; their downloads are cached between runs (.cache/cpm), one cache per
# job since each job fetches a different set. The artifacts are what `cmake --install` puts in place: the binaries
# with the licenses that go with them.
jobs:
  format:
    name: Formatting
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed clang git uv bash
      - uses: actions/checkout@v7
      - name: Check formatting
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/format.sh --check

  linux:
    name: Linux
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed cmake ninja make nasm python git clang sdl3
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-${{ github.job }}-${{ hashFiles('cmake/dependencies.cmake') }}
      - name: Build the runtime
        run: |
          cmake --preset default
          cmake --build --preset default
          cmake --install build/default --prefix stage
      - name: Build the headless backend too
        run: |
          cmake --preset default -B build/headless -DSWR_BACKEND=headless -DSWR_DEPLOY=OFF
          cmake --build build/headless
      # The game modules compile runtime/abi/cpu_helpers.c, which no CMake target does
      - name: Check the ABI helpers compile
        run: clang -fsyntax-only -Wall -fno-strict-aliasing -fwrapv -I runtime/abi runtime/abi/cpu_helpers.c
      - name: Check the Python scripts
        run: |
          python -m compileall -q switchrecomp scripts tools
          python -m switchrecomp --help > /dev/null
          python scripts/extract.py --help > /dev/null
          python scripts/recomp.py --help > /dev/null
          python tools/run_game.py --help > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: swr-runtime-linux
          path: stage

  appimage:
    name: Linux AppImage
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    # pkgforge's Arch image and tools (https://github.com/pkgforge-dev/Anylinux-AppImages), see scripts/make-appimage.sh
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      # Before the checkout: without git, actions/checkout downloads the files without the history, and the AppImage's
      # version (git describe) is unknown
      - name: Install git
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-${{ github.job }}-${{ hashFiles('cmake/dependencies.cmake') }}
      # The action pins its own setup script only: the tools that script downloads are pinned here to a commit of
      # Anylinux-AppImages, and checked against their SHA-256 below
      - name: Install the packaging tools
        uses: pkgforge-dev/anylinux-setup-action@b2d1ce4216f71162e00ae58fa11ee9aeb723d0d5 # v5
        env:
          QUICK_SHARUN: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/d4262a9978e7b5d88e3799b389b138eb244e3936/useful-tools/quick-sharun.sh
          DEBLOATED_PACKAGES: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/d4262a9978e7b5d88e3799b389b138eb244e3936/useful-tools/get-debloated-pkgs.sh
          MAKE_AUR_PACKAGE: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/d4262a9978e7b5d88e3799b389b138eb244e3936/useful-tools/make-aur-package.sh
      - name: Check the packaging tools
        run: |
          sha256sum -c <<'EOF'
          b38ac233f0b56a03bb10565f6b074a43ce016939faee44ae8bb23d6e66c2d553  /usr/local/bin/quick-sharun
          217ff68aafe085d2d4ab34a50e267805af43736ad8ef880c01ef88e52db8589f  /usr/local/bin/get-debloated-pkgs
          86afbf5045b78020c93fcd35bf0f642765a8dc339bb2dce534a0461ce3d3508d  /usr/local/bin/make-aur-package
          EOF
      - name: Install the build tools and the debloated Mesa
        run: |
          pacman -Syu --noconfirm --needed cmake ninja make nasm python clang sdl3 libx11 mesa vulkan-icd-loader
          get-debloated-pkgs --add-common --prefer-nano
      - name: Build and install into /usr
        run: |
          git config --global --add safe.directory '*'
          cmake --preset default -DSWR_DEPLOY=OFF -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build --preset default
          cmake --install build/default
      # The script names the AppImage after `git describe`
      - name: Make the AppImage
        run: scripts/make-appimage.sh
      # Only what the script made: dist/ also holds the tracked desktop entry and icon
      - uses: actions/upload-artifact@v7
        with:
          name: AppImage-x86_64
          path: |
            dist/*.AppImage*
            dist/appinfo

  freebsd:
    name: FreeBSD
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-${{ github.job }}-${{ hashFiles('cmake/dependencies.cmake') }}
      - name: Build the runtime
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: '15.1'
          usesh: true
          # A mirror caught mid-sync answers Not Found for some packages: refresh the catalogue and try once more
          prepare: |
            pkg install -y cmake ninja gmake nasm python3 sdl3 || { sleep 30; pkg update -f && pkg install -y cmake ninja gmake nasm python3 sdl3; }
          run: |
            cmake --preset default
            cmake --build --preset default

  windows-cross:
    name: Windows, cross-built on Linux
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed cmake ninja make nasm python git clang
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-${{ github.job }}-${{ hashFiles('cmake/dependencies.cmake') }}
      # The same llvm-mingw release as scripts/bootstrap.ps1, in its build for Linux
      - name: Install llvm-mingw
        run: |
          curl -sSLf -o /tmp/llvm-mingw.tar.xz \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64.tar.xz
          echo "5f9c6ed95b2d4bdb2869a488c5fd5857fbdabcf288a0aa3eb1da43f6a08d8ab4  /tmp/llvm-mingw.tar.xz" | sha256sum -c
          tar -xJf /tmp/llvm-mingw.tar.xz -C /opt
          echo /opt/llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64/bin >> "$GITHUB_PATH"
      - name: Build the runtime
        run: |
          cmake --preset windows-cross
          cmake --build --preset windows-cross
      - name: Build the headless backend too
        run: |
          cmake --preset windows-cross -B build/windows-headless -DSWR_BACKEND=headless -DSWR_DEPLOY=OFF
          cmake --build build/windows-headless
      - name: Check the ABI helpers compile for Windows
        run: |
          x86_64-w64-mingw32-clang -fsyntax-only -Wall -fno-strict-aliasing -fwrapv -I runtime/abi \
            runtime/abi/cpu_helpers.c

  windows:
    name: Windows
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-${{ github.job }}-${{ hashFiles('cmake/dependencies.cmake') }}
      # bootstrap.ps1 skips every tool already unpacked at its pinned hash
      - uses: actions/cache@v5
        with:
          path: |
            deps/tools
            !deps/tools/downloads
          key: tools-${{ hashFiles('scripts/bootstrap.ps1') }}
      - name: Install the toolchain
        run: .\scripts\bootstrap.ps1
      - name: Build the runtime
        run: |
          . .\scripts\env.ps1 -Isolated
          cmake --preset default
          if ($LASTEXITCODE) { exit 1 }
          cmake --build --preset default
          if ($LASTEXITCODE) { exit 1 }
          cmake --install build/default --prefix stage
          if ($LASTEXITCODE) { exit 1 }
      - name: Check the Python scripts
        run: |
          . .\scripts\env.ps1 -Isolated
          python -m switchrecomp --help > $null
          if ($LASTEXITCODE) { exit 1 }
          python scripts\extract.py --help > $null
          if ($LASTEXITCODE) { exit 1 }
          python scripts\recomp.py --help > $null
          if ($LASTEXITCODE) { exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: swr-runtime-windows
          path: stage

  # Every push to main that builds everywhere replaces the rolling "nightly" prerelease with that commit's AppImage.
  # A newer push cancels a release still running, so an older commit never publishes last
  release:
    name: Nightly release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [format, linux, appimage, freebsd, windows-cross, windows]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: nightly-release
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: AppImage-x86_64
      - name: Release the AppImage
        uses: pkgforge-dev/make-nightly-appimage-release@17cbe90fc0796286e424619a54a82a3a880efe4c # v1.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # The GPL asks for the way to the source next to the binary
      - name: Say where the source is
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit nightly --repo "$GITHUB_REPOSITORY" --notes "Built from commit $GITHUB_SHA, whose source is at $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_SHA.

          The third-party libraries built into the runtime are fetched from the release archives that cmake/dependencies.cmake lists at that commit, each checked against the SHA-256 written next to it. The AppImage also bundles libraries from Arch Linux packages. The licenses of everything it holds are in its share/licenses folder, with the list of those packages in share/licenses/bundled-packages.txt."
