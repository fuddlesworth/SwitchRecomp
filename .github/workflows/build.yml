name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Linux jobs run in Arch Linux, which has the same Clang 23 and clang-format 23 as development. The Windows job starts
# from a bare runner and gets every tool from scripts/bootstrap.ps1, the way a Windows user does. The third-party
# libraries come from CPM.cmake at configure time; their downloads are cached between runs (.cache/cpm).
jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed clang git uv bash
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/format.sh --check

  linux:
    name: Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed cmake ninja nasm python git clang mesa sdl3
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-${{ hashFiles('cmake/dependencies.cmake') }}
      - name: Build the runtime
        run: |
          cmake --preset default
          cmake --build --preset default
      - name: Build without the Vulkan renderer too
        run: |
          cmake --preset default -B build/novulkan -DSWR_VULKAN=OFF
          cmake --build build/novulkan
      - name: Check the Python scripts
        run: |
          python -m compileall -q switchrecomp scripts tools
          python -m switchrecomp --help > /dev/null
          python scripts/extract.py --help > /dev/null
          python scripts/recomp.py --help > /dev/null
          python tools/run_game.py --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: swr-runtime-linux
          path: build/default/swr-runtime

  appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest
    # pkgforge's Arch image and tools (https://github.com/pkgforge-dev/Anylinux-AppImages), see scripts/make-appimage.sh
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-${{ hashFiles('cmake/dependencies.cmake') }}
      - name: Install the packaging tools
        uses: pkgforge-dev/anylinux-setup-action@b2d1ce4216f71162e00ae58fa11ee9aeb723d0d5 # v5
      - name: Install the build tools and the debloated Mesa
        run: |
          pacman -Syu --noconfirm --needed cmake ninja nasm python clang sdl3 libx11 mesa vulkan-icd-loader
          get-debloated-pkgs --add-common --prefer-nano
      - name: Build and install into /usr
        run: |
          git config --global --add safe.directory '*'
          cmake --preset default -DSWR_DEPLOY=OFF -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build --preset default
          cmake --install build/default
      - name: Make the AppImage
        run: |
          VERSION=$(git describe --always) scripts/make-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AppImage-x86_64
          path: dist

  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-${{ hashFiles('cmake/dependencies.cmake') }}
      - name: Build the runtime
        uses: vmactions/freebsd-vm@v1.5.8
        with:
          release: '15.1'
          usesh: true
          prepare: pkg install -y cmake ninja nasm python3 sdl3 libglvnd
          run: |
            cmake --preset default
            cmake --build --preset default

  windows-cross:
    name: Windows, cross-built on Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed cmake ninja nasm python git
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-${{ hashFiles('cmake/dependencies.cmake') }}
      - name: Install llvm-mingw
        run: |
          curl -sSLf -o /tmp/llvm-mingw.tar.xz \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64.tar.xz
          echo "5f9c6ed95b2d4bdb2869a488c5fd5857fbdabcf288a0aa3eb1da43f6a08d8ab4  /tmp/llvm-mingw.tar.xz" | sha256sum -c
          tar -xJf /tmp/llvm-mingw.tar.xz -C /opt
          echo /opt/llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64/bin >> "$GITHUB_PATH"
      - name: Build the runtime
        run: |
          cmake --preset windows-cross
          cmake --build --preset windows-cross

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-${{ hashFiles('cmake/dependencies.cmake') }}
      - name: Install the toolchain
        run: .\scripts\bootstrap.ps1
      - name: Build the runtime
        run: |
          . .\scripts\env.ps1 -Isolated
          cmake --preset default
          if ($LASTEXITCODE) { exit 1 }
          cmake --build --preset default
          if ($LASTEXITCODE) { exit 1 }
      - name: Check the Python scripts
        run: |
          . .\scripts\env.ps1 -Isolated
          python scripts\extract.py --help > $null
          if ($LASTEXITCODE) { exit 1 }
          python scripts\recomp.py --help > $null
          if ($LASTEXITCODE) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: swr-runtime-windows
          path: build/default/swr-runtime.exe

  # Every push to main that builds everywhere replaces the rolling "nightly" prerelease with that commit's AppImage
  release:
    name: Nightly release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [format, linux, appimage, freebsd, windows-cross, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AppImage-x86_64
      - name: Release the AppImage
        uses: pkgforge-dev/make-nightly-appimage-release@17cbe90fc0796286e424619a54a82a3a880efe4c # v1.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
