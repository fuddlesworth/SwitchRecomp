name: Bug on Android
description: A game, the menu or the recompile goes wrong in the Android app.
title: "[android] "
labels: ["kind: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Say what happens after the `[android]` in the title.

        Never attach keys (`prod.keys`, `title.keys`), dumps (XCI, NSP, NCA), files from `work/` or from a game's folder other than its log, or saves. Nothing of the game goes into an issue.
  - type: input
    id: device
    attributes:
      label: Device, Android version and RAM
      placeholder: Poco F8, Android 16, 11 GB
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      description: The game's log names the GPU on its `vulkan:` line.
      placeholder: Adreno 750, the system's driver
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build
      description: The first line of the menu's Share log.
      placeholder: ScarletNX <branch> <commit> (<compiler>, Android arm64)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install kind
      options:
        - Nightly APK
        - A pull request's APK
        - Built from source
        - Other (say which in the steps)
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game title ID and version
      description: The title ID is the name of the game's folder in `games/`. The version is the base game's or the update's you installed.
      placeholder: 010019A01E2F2000 v0
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What you did, from the start, so someone else can do the same.
      placeholder: |
        1. Setup device keys, pick prod.keys from Download
        2. Load Switch NSP/XCI/NRO, pick the XCI
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happens instead. A screenshot helps for anything on the screen.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Use the menu's Share log after the problem. It saves `/sdcard/ScarletNX/scarletnx.log` with the build, the last run's output and the newest game log, and opens the share sheet with it. Attach that file here.
    validations:
      required: true
  - type: checkboxes
    id: nothing-of-the-game
    attributes:
      label: Nothing of the game
      options:
        - label: I attached no keys, dumps or game files.
          required: true
